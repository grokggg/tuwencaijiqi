//年-月-日 时:分:秒
function dateFormatTime (date) {
var date = new Date(date);
var y = date.getFullYear();
var m = date.getMonth() + 1;
m = m < 10 ? ('0' + m) : m;
var d = date.getDate();
d = d < 10 ? ('0' + d) : d;
var h = date.getHours();
h = h < 10 ? ('0' + h) : h;
var minute = date.getMinutes();
var second = date.getSeconds();
minute = minute < 10 ? ('0' + minute) : minute;
second = second < 10 ? ('0' + second) : second;
return y + '-' + m + '-' + d + ' ' + h + ':' + minute + ':' + second; //年月日时分秒
}
// 获取当前平台信息
function getPlatformInfo(key) {
//运行环境是浏览器
let inBrowser = typeof window !== 'undefined';
//运行环境是微信
let inWeex = typeof WXEnvironment !== 'undefined' && !!WXEnvironment.platform;
let weexPlatform = inWeex && WXEnvironment.platform.toLowerCase();
//浏览器 UA 判断
let UA = inBrowser && window.navigator.userAgent.toLowerCase();
// let networkStr = window.navigator.connection.effectiveType
let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {type:'unknown'};
let networkStr = connection.type;
// 兼容IOS获取网络类型
if(UA && UA.match(/iphone|ipad|ipod|ios/i)){
var networkStr1 = UA.match(/NetType\/\w+/i) ? UA.match(/NetType\/\w+/i)[0] : 'NetType/other';
networkStr = networkStr1.toLowerCase().replace('nettype/', '');
}
if(UA){
let platforms = {
IE: /msie|trident/.test(UA),
IE9: UA.indexOf('msie 9.0') > 0,
Edge: UA.indexOf('edge/') > 0,
Android: UA.indexOf('android') > 0 || (weexPlatform === 'android'),
IOS: /iphone|ipad|ipod|ios/.test(UA) || (weexPlatform === 'ios'),
Chrome: /chrome\/\d+/.test(UA) && !(UA.indexOf('edge/') > 0),
net: networkStr
}
if(key) {
return platforms[key]
}
}
}
//随机字符串 10位
function randomStr (num) {
var chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
var length = num || 10;
var result = '';
for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
return result;
}
