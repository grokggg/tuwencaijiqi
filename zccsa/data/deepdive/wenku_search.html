kUrl":""}],"newGenflowPageBottomBanner":[{"title":"AI算力产业链商业分析","bgUrl":"https://edu-wenku.bdimg.com/v1/pc/PC%C2%B7Genflow/%E8%BF%90%E8%90%A5%E4%BD%8D01-AI%E7%AE%97%E5%8A%9B%E4%BA%A7%E4%B8%9A%E9%93%BE%E5%95%86%E4%B8%9A%E5%88%86%E6%9E%90-1781667861143.png","prompt":"请用专业模式（HTML）生成一份中文商业分析 PPT，主题为《AI 算力产业链商业分析：从芯片、云厂商到应用层机会》。\n\n目标受众：企业管理层、战略部门、投资研究人员。\n使用场景：行业研究汇报、投研路演、战略研讨。\n页数：12 页左右，目录层级要求具有高概括性，约束在5个条目以内。\n风格：高端投研报告 + 科技金融简报。整体克制、专业、精致，避免模板感。主色为深石墨黑、冷灰、雾白，少量使用青绿色或电光蓝作为强调色。字体统一，版式留白充足，信息层级清晰。\n\n请生成以下内容：\n1. 封面：使用数据中心/算力基础设施视觉，标题有科技金融感。\n2. 核心结论：3-4 条明确判断，直接给出产业链机会分化结论。\n3. 行业背景：大模型推动训练与推理算力需求增长的逻辑。\n4. 产业链利润池：芯片、服务器、云服务、模型平台、应用层的价值分布。\n5. 市场增长驱动：需求来源、关键指标、增长假设。\n6. 公司类型对比：芯片厂商、云厂商、软件平台、垂直应用的商业模式差异。\n7. 财务观察框架：收入增长、毛利率、资本开支、现金流、估值倍数。\n8. 竞争格局：头部壁垒、生态优势、供应链约束、国产替代。\n9. 股价驱动模型：业绩预期、利率、CAPEX、商业化进展、风险偏好的影响。\n10. 未来 12-24 个月机会：按确定性和弹性划分细分方向。\n11. 主要风险：需求、估值、监管、供应链、技术路线风险。\n12. 结论：用一句有洞察力的判断收束全篇。\n\n设计要求：\n- 每页必须有一句“核心判断”，不能只是罗列信息。\n- 不要连续使用相同的卡片布局；页面节奏需要包含封面图、结论页、产业链地图、矩阵、趋势图、四象限图、风险收益图等不同形态。\n- 财务、估值、股价相关页面要优先使用投研图表表达，不要只用文字卡片。\n- 表头和title等重要字段，不要发生旋转，保证可读性。\n- 如果无法获取实时数据，不要编造具体股价或财报数字；使用“示意框架”呈现，并减少明显的“待补充数据”字样。\n- 保持商业分析口吻，不构成投资建议。","skillType":"ppt","linkType":"skill","linkUrl":"https://www.baidu.com"},{"title":"产品经理试用期述职报告","bgUrl":"https://edu-wenku.bdimg.com/v1/pc/PC%C2%B7Genflow/%E8%BF%90%E8%90%A5%E4%BD%8D02-%E4%BA%A7%E5%93%81%E7%BB%8F%E7%90%86%E8%AF%95%E7%94%A8%E6%9C%9F%E8%BF%B0%E8%81%8C%E6%8A%A5%E5%91%8A-1774237308529.png","prompt":"请直接用写作大师生成产品经理试用期转正述职报告，包含工作成果、能力成长、未来规划，诚恳专业风格，并配上对应的图表","skillType":"ppt","linkType":"skill","linkUrl":"https://www.baidu.com"},{"title":"带父母游北京5日深度攻略","bgUrl":"https://edu-wenku.bdimg.com/v1/pc/PC%C2%B7Genflow/%E8%BF%90%E8%90%A5%E4%BD%8D03%E5%B8%A6%E7%88%B6%E6%AF%8D%E6%B8%B8%E5%8C%97%E4%BA%AC5%E6%97%A5%E6%B7%B1%E5%BA%A6%E6%94%BB%E7%95%A5-1774237308865.png","prompt":"生成带父母游北京的5日攻略，节奏舒缓、少走路、多文化景点，包含每日行程、餐饮推荐、避坑指南","skillType":"ppt","linkType":"skill","linkUrl":"https://www.baidu.com"},{"title":"ChatGPT与DeepSeek对比分析博客","bgUrl":"ht
