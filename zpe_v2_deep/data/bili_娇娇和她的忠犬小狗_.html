":d,"65785101":d,"70529100":d,"71714100":d,"72873105":d,"73163100":d,"73249100":d,"73351101":d,"73615101":d,"73827102":d,"74580100":d,"75589100":d,"76154102":d,"76385100":d,"76395103":d,"76498104":d,"77485101":d,"77759100":d,"78045100":d,"78121105":d,"78297106":d,"78597100":d,"78626106":d,"78737104":d,"78772101":d,"78834100":d,"78850101":d,"78860100":d,"78894100":d,"79005102":d,"79058101":d,"79103101":d,"79202100":d,"79203101":d,"79245102":d,"79251105":d,"79451101":d,"79525100":d,"79535103":d,"79559103":d,"79688102":d,"79825102":d,"79867104":d},egg_hit:a,result:[{author:"奈何世上无人懂",category_id:k,category_name:i,comment_url:b,desc:"故事发生在纪元时代，此时后时间推移到2122年，随着AI技术的的不断提升人类也逐渐形成了与AI交流，科学研发后AI从虚拟的屏幕走了出来此事后就拥有了心灵AI机器人！而作为心灵机器人的一号完整机沈念念拥有着超出想象的能力他能读取心中所想知识库完全并且能完成各项难度的动作！ 一个身穿机械制服，带着数字眼睛的主持人悬空而立！对台下的观众喊道：女士们先生们随着新时代的跟进我们首台AI智能机器人沈念念即将发布届时沈念念给大家打招呼！随着主持人的话音落下台下纷纷传来掌声，主持人一跃而起跳到了厅板，用手按动了一个按钮这",id:34889348,image_urls:["\u002F\u002Fi0.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002Ffd65e13b165964154985593500daed2b500167122.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:500167122,pub_time:cm,pubdate:cm,rank_index:g,rank_offset:a,reply:a,spread_id:a,sub_type:a,template_id:h,title:"Ai机器人\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E",type:l,version:b,view:j,pubstr:"2024-05-29"},{author:"Hlfjvb柳梦何厌青花",category_id:k,category_name:i,comment_url:b,desc:"我穿书了，穿成了高考状元的炮灰养母。 书里，我女儿患有严重的自闭症。 为了给她找个学习伙伴，我从福利院资助了一个女孩当陪读。 我一手把她培养成了省状元。 可高考采访那天，她对着镜头哭：\"养母逼我给她自闭症的亲生女儿当免费保姆，我是被利用的工具人。\" 全网心疼她，骂我变态、没人性。 我坠楼死后，她霸凌我女儿，害得我女儿抑郁自杀。 穿书那天，我正站在福利院走廊里。 她抬起头看着我： \"阿姨，我不想去了只当陪读，我想有个真正的家。\" “那就别去了。” 我牵起女儿的手转身就走。 ...... 福利院走廊里，我看着",id:50773358,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002Fdcdee9c04da95d2359da6aaa257de32010069237.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:10069237,pub_time:cn,pubdate:cn,rank_index:j,rank_offset:g,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《穿成炮灰养母后，我带自闭症女儿离开》林见薇沈维舟陈思语\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E：全文结局",type:l,version:b,view:a,pubstr:"06-22"},{author:"三水十三",category_id:k,category_name:i,comment_url:b,desc:"au，ooc，全文虚拟，请勿上升真人，只是一个普通庸俗的狗血爱情故事 席间觥筹交错，王楚钦向来不爱参加这种宴会，奈何主办方盛情邀请再加上顾云舟非要凑这个热闹，不然他不会站在这里。 “诶诶诶，你表情好点，凶神恶煞的还有那个妹妹赶过来。”顾云舟端着一杯酒晃悠一圈回来，王楚钦瞥了一眼没搭理他的话，“你逛好了没，逛好了回去。” “这才多久，人主人家都还没出来你就走，讲点儿礼貌吧。”顾云舟难以置信地看了眼手表时间，“回去多无聊。” “你走不走？” “王总，王大少爷。我真就搞不懂了，你孤家寡人一个天天闷家里干什么啊，",id:41609412,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F28958e30a2151194cfbb855377ef4c2e497475915.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:145,mid:497475915,pub_time:co,pubdate:co,rank_index:n,rank_offset:j,reply:Y,spread_id:a,sub_type:a,template_id:h,title:"【5114】爱人和爱人",type:l,version:b,view:4595,pubstr:"2025-05-10"},{author:"Ocniha赤兔马",category_id:k,category_name:i,comment_url:b,desc:"填报志愿的前一秒，我做了个让全家后悔一生的决定。 就在刚刚，和我有娃娃亲的竹马周辞，毫不犹豫地为我妹妹改掉了自己的志愿。 直到这时我才明白，娃娃亲的承诺，从来都轮不到我。 周辞笑着对我爸说。 \"叔叔您放心，我降分去三亚陪瑶瑶，大学四年我保证照顾好她。\" 爸爸欣慰地拍他肩膀。 妈妈回头看向坐在角落的我，理所当然地开口。 \"念念，你就报个三亚护理专科吧，反正你从小伺候人习惯了。\" 周辞也点头。 \"对，刚好照顾瑶瑶。\" 那一刻我才彻底心死。 从小到大，下雨天爸妈的伞永远倾斜在妹妹头顶。 他们说我要懂事，我是姐姐",id:50943978,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F6cc686edc390de6d6138e836ea55157814387098.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:14387098,pub_time:cp,pubdate:cp,rank_index:h,rank_offset:n,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《自此归途不问，因为前路有光》\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E周辞沈瑶瑶：全文结局",type:l,version:b,view:a,pubstr:"06-27"},{author:"橘猫念文",category_id:k,category_name:i,comment_url:b,desc:"年代文 1、《被嫌弃的英子的逆袭》作者：梦里闲人 2、《八零农媳是反派》作者：八匹 3、《炮灰姐姐逆袭记》作者：八匹 4、《穿进年代文苦情剧本里[八零]》作者：姜丝煮酒 5、《穿书七零首富的炮灰前妻》作者：云纤月 6、《我在年代文里暴富》作者：乔一水 7、《成为年代文炮灰女配后》作者：沈宝爷 8、《七零错换人生》作者：老胡十八 9、《穿书九零，买房置地》作者：薛定谔家里的猫 10、《恶毒女配六零种田》作者：礼瑜 11、《六零年代假夫妻》作者：番茄菜菜 12、《八零之悍媳当家》作者：玖月心久 13、《穿成年",id:41399537,image_urls:["\u002F\u002Fi0.hdslb.com\u002Fbfs\u002Farticle\u002Fbc592cf08cb6afb723cdfd81e95f073c3493116805908805.jpg"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:g,mid:3493116805908805,pub_time:cq,pubdate:cq,rank_index:r,rank_offset:h,reply:a,spread_id:a,sub_type:a,template_id:h,title:"15本「年代文」推荐，配角逆袭",type:l,version:b,view:r,pubstr:"2025-04-26"},{author:"抹抹读书",category_id:k,category_name:i,comment_url:b,desc:"最近看电视剧《大唐荣耀》，被其中广平王李俶和沈珍珠纯粹美好的爱情故事和家国情怀打动，忍不住探究历史原型。考古了更类资料，甚至贴吧，总想在历史蛛丝马迹中探明真相，很久没有写这样的万字长文，只为看到李俶沈珍珠时，那份最初打动的美好。唐代宗李豫(726年-779年)，初名李俶，唐朝第九位皇帝，最初以皇孙身份受封广平王，在位十七年。公元741年，开元初，沈氏以良家子身份入选东宫，被太子赐给十五岁的广平王李俶。742年生子，也是继任皇帝唐德宗。安史之乱爆发，唐玄宗仓皇出逃，沈氏以及部分宗亲未能有幸随驾出逃",id:17454463,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Farticle\u002Fbanner\u002F881f7a475903c9e417e932aab65721d4285414fe.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:q,mid:602515964,pub_time:cr,pubdate:cr,rank_index:q,rank_offset:r,reply:g,spread_id:a,sub_type:a,template_id:h,title:"大唐未解之谜：历史上失踪46年的睿真沈皇后，原来你真是帝王的偏爱",type:l,version:b,view:ck,pubstr:"2022-07-07"},{author:"9527难念的经",category_id:k,category_name:i,comment_url:b,desc:"出院后，沈南絮在家养了三个月，才第一次出门参加朋友聚会。 　　推门而入的那一刻，一眼看见了被簇拥着的谢郁川，一贯散漫的男人多了几分清爽。 　　他身侧站了个小姑娘，十八二十的年纪，嫩得像颗能掐出水的蜜桃。 　　看着谢郁川一杯又一杯地喝，小姑娘在旁边欲言又止地扯着他衣袖，眼角慢慢漫上绯色。 　　谢郁川见状将酒杯放下，对着几个朋友笑着道： 　　行了行了，烟我戒了，酒今天也喝到这，再喝我女朋友得生气了。小姑娘娇着呢，生气了不好哄。 　　他语气里没有半点不耐，反而带了几分被人管着的得意。 　　小姑娘顿时破涕为笑，有",id:49914303,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002Fa93ed4906938d6560dfd03c7ef6d644a416312341.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:416312341,pub_time:cs,pubdate:cs,rank_index:w,rank_offset:q,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《爱意藏于旧梦错》沈南絮谢郁川池\u003Cem class=\"keyword\"\u003E念念\u003C\u002Fem\u003E：全文阅读",type:l,version:b,view:a,pubstr:"06-01"},{author:"小肚挺源流",category_id:k,category_name:i,comment_url:b,desc:"我把快递拿进隔间，拆开。 墨绿色的封面上，印着六个字。 国防科技大学。 后续宫·众·呺：【转角书屋】回复：94693 我盯着看了三秒。 然后把录取通知书压进行李箱最底层。 那一刻，我很想给谁打个电话。 想听一句恭喜。 哪怕只是很轻很淡的一句，也好。 可通讯录从上翻到下，我才发现，原来这些年，我连一个可以分享喜讯的人都没有。 我把手机扣在桌上，慢慢蹲下去。 隔壁客厅里，妈妈正笑着问沈瑶瑶升学宴要穿哪条裙子。 我咬住手背，没有哭出声。 升学宴当天，也是我离开的前一天。 我早上八点到酒店。 吹气球，贴背景板，摆",id:508773 想到回京不多久就能见到自己的婉儿，再不久就能成亲，范闲心情愈发好。近乡情怯，说的大概就是言冰云。他许久未见父亲，许久未回京城，也不知京中形势如何，再看看他身旁的沈婉儿，心情愈发沉重。无论京中如何腥风血雨，他一定护她周全。一行人回京的第一件事自然是面见陛下，陛下颇多嘉奖。只是散去时留下来范闲和言冰云。“范闲，这次差事办的不错。”“谢陛下夸奖。陛下，那臣和……”“你和婉儿郡主的婚约朕记得呢，看你着急的样子。这样，朕命人挑个好日子，",id:4343278,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Farticle\u002Fbanner\u002Ff17a3437426272c73d131dcbb321d5a916b17fda.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:x,mid:30114264,pub_time:cx,pubdate:cx,rank_index:E,rank_offset:B,reply:h,spread_id:a,sub_type:a,template_id:h,title:"（言沈cp）关雎淇奥（4）",type:l,version:b,view:636,pubstr:"2020-01-13"},{author:"娱乐时尚",category_id:k,category_name:i,comment_url:b,desc:"正在热播的《宁安如梦》还有谁没追吗？小编我已经沉迷其中不可自拔了，主打一个在《宁安如梦》吃流水席，想嗑哪对嗑哪对，先是嗑“燕中有宁”明目张胆的偏爱，后来嗑“遮么爱宁”的天降白月光，“危宁写诗”疯批强制爱也别有一番风味。 不过小编最近二刷品到了“玠是为宁”这对帝后CP，因为沈玠（周大为 饰）总是捡到手帕并爱上帕子的主人，被网友调侃为“手帕癫公”。在此小编要为沈玠正名，他才不是什么手帕癫公，他给姜雪宁（白鹿 饰）的爱也很拿得出手 ！ 手帕情缘将错就错，不择手段登上后位 在前一次，姜雪宁得知沈玠曾因救过姜雪蕙一",id:27916689,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Farticle\u002Fbanner\u002F8811f45c70b48222fb406a812e5a792f3546561774619151.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:3546561774619151,pub_time:cy,pubdate:cy,rank_index:T,rank_offset:E,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《宁安如梦》谁说沈玠是手帕癫公我是第一个不同意的",type:l,version:b,view:x,pubstr:"2023-11-24"},{author:"是小桃汽泡",category_id:k,category_name:i,comment_url:b,desc:"出院后，沈南絮在家养了三个月，才第一次出门参加朋友聚会。 推门而入的那一刻，一眼看见了被簇拥着的谢郁川，一贯散漫的男人多了几分清爽。 他身侧站了个小姑娘，十八二十的年纪，嫩得像颗能掐出水的蜜桃。 看着谢郁川一杯又一杯地喝，小姑娘在旁边欲言又止地扯着他衣袖，眼角慢慢漫上绯色。 谢郁川见状将酒杯放下，对着几个朋友笑着道： “行了行了，烟我戒了，酒今天也喝到这，再喝我女朋友得生气了。小姑娘娇着呢，生气了不好哄。” 他语气里没有半点不耐，反而带了几分被人管着的得意。 小姑娘顿时破涕为笑，有些羞怯地捶了捶他。 沈南",id:49866961,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F8e9411fc49e4faa950734d1fbb4d9695687679583.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:687679583,pub_time:cz,pubdate:cz,rank_index:C,rank_offset:T,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《爱意藏于旧梦》沈南絮谢郁川池\u003Cem class=\"keyword\"\u003E念念\u003C\u002Fem\u003E：全文结局",type:l,version:b,view:a,pubstr:"05-31"},{author:"G_李富贵-",category_id:k,category_name:i,comment_url:b,desc:"　　刚出民政局，军火枭老公忽然毫无预兆地开口。 　　“我和你闺蜜又睡了。” 　　我愣在原地，脸上血色尽失，他指着面前的敞篷跑车： 　　“昨天她穿得太性感，把我压在车里，我没忍住。” 　　一模一样的背叛，我栽了第二次。 　　刹那间，我浑身血液都冻结了。 　　沈迟舟却笑容暧昧：“现在我能理解谢景了，叶念念比你更懂情趣。” 　　谢景是我的黑手党前夫，叶念念是我曾经的闺蜜。 　　五年前，他们被我抓奸在床，是沈迟舟给我通风报信的。 　　那时，他拯救了万念俱灰的我。 　　我以为终于得到真爱，沈迟舟却为同样的人背叛了我",id:51750507,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F20ef81d973e7721e46b575cf3cc397f63690985812920897.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:3690985812920897,pub_time:cA,pubdate:cA,rank_index:K,rank_offset:C,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《一赌情深，半生皆错》沈静安沈迟舟叶\u003Cem class=\"keyword\"\u003E念念\u003C\u002Fem\u003E：全文结局",type:l,version:b,view:a,pubstr:"07-23"},{author:"小羊的2梦2",category_id:k,category_name:i,comment_url:b,desc:"考上重点大学那天，爸妈送我的惊喜是一个弟弟，亲的。 这年我18岁，父母已经46岁。 我爸怀里抱着那个婴儿，看我的眼神像防贼一样: 你要上大学可以，我们一分钱生活费都不会出，钱要存着将来给你弟买房买车。 我在做兼职的路上被撞了，联系我爸，他回了句:真晦气，怎么没把你撞死？ 七年后，父母双双下岗失业，他们抱着那个患有心脏病的弟弟来找我，理直气壮的说: 长姐如母，你必须要对你弟负责。 高考成绩出来，我考了683分，稳上双一流大学。 查到分数以后，我被我爸一个电话叫到医院，说是给我准备了惊喜。 去往医院的路上，我",id:49723017,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F04901d6d5e8a45e01e0c4beafb1bf889352442831.png"],is_comment:a,is_fold:e,is_official:e,is_rk1:e,like:a,mid:352442831,pub_time:cB,pubdate:cB,rank_index:k,rank_offset:K,reply:a,spread_id:a,sub_type:a,template_id:h,title:"全网爆火 爸妈执意高龄拼二胎男宝，我让他们追悔莫及 张婉沈临喻 考上重点大学那天，爸妈送我的惊喜是一",type:l,version:b,view:a,pubstr:U},{author:"数兜兜里的糖果",category_id:t,category_name:cw,comment_url:b,desc:"第二章 沈浩然把纸条塞到高访手里之后就一直抓着手机在房间里走来走去，坐立不安的模样让隔壁床的大叔忍不住调侃他：“咋啦，这会子坐不住了？”“没有。”沈浩然死鸭子嘴硬，一屁股坐在床上，因为脖子不方便，所以一直都是举着手机到立在面前，那姿势一本正经又滑稽得可笑，像是犯了老花眼的老太太似的。“别急啊，哪个小姑娘会那么快答应你，再等等。”大叔倒是一脸过来人的模样，递给他一片削好的苹果。沈浩然囫囵地吞下苹果，略微惊讶地问：“你怎么知道？”“啧，看你又哭又笑的，就知道你思春了，我呀，过来人，怎么不知道。”大叔",id:1486521,image_urls:["\u002F\u002Fi1.hdslb.com\u002Fbfs\u002Farticle\u002Fd6aa935186d550163ff73adec73f72d76c148c17.jpg"],is_comment:a,is_fold:e,is_official:e,
