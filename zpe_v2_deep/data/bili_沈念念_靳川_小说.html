45105":e,"78121105":e,"78296101":e,"78299103":e,"78364101":e,"78626103":e,"78757104":e,"78772100":e,"78834100":e,"78850100":e,"78860104":e,"79005100":e,"79058100":e,"79103102":e,"79202105":e,"79203100":e,"79245101":e,"79251105":e,"79451102":e,"79559104":e,"79854102":e,"79867103":e,"79869103":e},egg_hit:a,result:[{author:"Hlfjvb柳梦何厌青花",category_id:m,category_name:h,comment_url:b,desc:"我穿书了，穿成了高考状元的炮灰养母。 书里，我女儿患有严重的自闭症。 为了给她找个学习伙伴，我从福利院资助了一个女孩当陪读。 我一手把她培养成了省状元。 可高考采访那天，她对着镜头哭：\"养母逼我给她自闭症的亲生女儿当免费保姆，我是被利用的工具人。\" 全网心疼她，骂我变态、没人性。 我坠楼死后，她霸凌我女儿，害得我女儿抑郁自杀。 穿书那天，我正站在福利院走廊里。 她抬起头看着我： \"阿姨，我不想去了只当陪读，我想有个真正的家。\" “那就别去了。” 我牵起女儿的手转身就走。 ...... 福利院走廊里，我看着",id:50773358,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002Fdcdee9c04da95d2359da6aaa257de32010069237.png"],is_comment:a,is_fold:d,is_official:d,is_rk1:d,like:a,mid:10069237,pub_time:cz,pubdate:cz,rank_index:g,rank_offset:a,reply:a,spread_id:a,sub_type:a,template_id:i,title:"《穿成炮灰养母后，我带自闭症女儿离开》林见薇沈维舟陈思语\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E：全文结局",type:k,version:b,view:a,pubstr:"06-22"},{author:"李-很乖",category_id:m,category_name:h,comment_url:b,desc:"妹妹玩烟花让我右耳永久性失聪。 艺考复试，我听不见伴奏，专业分被判不合格。 我离准备了三年的大学，只差一张合格证。 事后，爸妈把妹妹送去国外。 哥哥删了她所有联系方式。 就连陆沉，也说再也不会见她。 我一直以为，他们是真的心疼我。 直到七年后，妹妹毕业回国。 妈妈把车钥匙递给我。 “去接你妹妹。” 我看着手机上的答辩通知。 说：“我不去了。” “下午有答辩。” 客厅里瞬间安静下来。 妈妈眼眶一下红了。 “七年了！” “她一个人在国外生病，一个人在国外过生日，连外婆去世都不敢回来。” “你怎么还是不肯放过她",id:51385276,image_urls:["\u002F\u002Fi0.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F80912f58f9b7c06fbb469a22de0982a43690992154708850.png"],is_comment:a,is_fold:d,is_official:d,is_rk1:d,like:a,mid:3690992154708850,pub_time:cA,pubdate:cA,rank_index:j,rank_offset:g,reply:a,spread_id:a,sub_type:a,template_id:i,title:"《右耳不听风，余生不相逢》沈晚陆沉\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E：全文结局",type:k,version:b,view:a,pubstr:aa},{author:"奈何世上无人懂",category_id:m,category_name:h,comment_url:b,desc:"故事发生在纪元时代，此时后时间推移到2122年，随着AI技术的的不断提升人类也逐渐形成了与AI交流，科学研发后AI从虚拟的屏幕走了出来此事后就拥有了心灵AI机器人！而作为心灵机器人的一号完
