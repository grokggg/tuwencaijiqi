003Cem class=\"keyword\"\u003E沈念念沈\u003C\u002Fem\u003E瑶瑶txt结局全文完整阅读",type:j,version:b,view:a,pubstr:"06-25"},{author:"Ocniha赤兔马",category_id:m,category_name:i,comment_url:b,desc:"填报志愿的前一秒，我做了个让全家后悔一生的决定。 就在刚刚，和我有娃娃亲的竹马周辞，毫不犹豫地为我妹妹改掉了自己的志愿。 直到这时我才明白，娃娃亲的承诺，从来都轮不到我。 周辞笑着对我爸说。 \"叔叔您放心，我降分去三亚陪瑶瑶，大学四年我保证照顾好她。\" 爸爸欣慰地拍他肩膀。 妈妈回头看向坐在角落的我，理所当然地开口。 \"念念，你就报个三亚护理专科吧，反正你从小伺候人习惯了。\" 周辞也点头。 \"对，刚好照顾瑶瑶。\" 那一刻我才彻底心死。 从小到大，下雨天爸妈的伞永远倾斜在妹妹头顶。 他们说我要懂事，我是姐姐",id:50943978,image_urls:["\u002F\u002Fi2.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F6cc686edc390de6d6138e836ea55157814387098.png"],is_comment:a,is_fold:d,is_official:d,is_rk1:d,like:a,mid:14387098,pub_time:cu,pubdate:cu,rank_index:l,rank_offset:k,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《自此归途不问，因为前路有光》\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E周辞沈瑶瑶：全文结局",type:j,version:b,view:a,pubstr:"06-27"},{author:"李-很乖",category_id:m,category_name:i,comment_url:b,desc:"妹妹玩烟花让我右耳永久性失聪。 艺考复试，我听不见伴奏，专业分被判不合格。 我离准备了三年的大学，只差一张合格证。 事后，爸妈把妹妹送去国外。 哥哥删了她所有联系方式。 就连陆沉，也说再也不会见她。 我一直以为，他们是真的心疼我。 直到七年后，妹妹毕业回国。 妈妈把车钥匙递给我。 “去接你妹妹。” 我看着手机上的答辩通知。 说：“我不去了。” “下午有答辩。” 客厅里瞬间安静下来。 妈妈眼眶一下红了。 “七年了！” “她一个人在国外生病，一个人在国外过生日，连外婆去世都不敢回来。” “你怎么还是不肯放过她",id:51385276,image_urls:["\u002F\u002Fi0.hdslb.com\u002Fbfs\u002Fnew_dyn\u002Fbanner\u002F80912f58f9b7c06fbb469a22de0982a43690992154708850.png"],is_comment:a,is_fold:d,is_official:d,is_rk1:d,like:a,mid:3690992154708850,pub_time:cv,pubdate:cv,rank_index:h,rank_offset:l,reply:a,spread_id:a,sub_type:a,template_id:h,title:"《右耳不听风，余生不相逢》沈晚陆沉\u003Cem class=\"keyword\"\u003E沈念念\u003C\u002Fem\u003E：全文结局",type:j,version:b,view:a,pubstr:"07-11"},{author:"奈何世上无人懂",category_id:m,category_name:i,comment_url:b,desc:"故事发生在纪元时代，此时后时间推移到2122年，随着AI技术的的不断提升人类也逐渐形成了与AI交流，科学研发后AI从虚拟的屏幕走了出来此事后就拥有了心灵AI机器人！而作为心灵机器人的一号完整机沈念念拥有着超出想象的能力他能读取心中所想知识库完全并且能完成各项难度的动作！ 一个身穿机械制服，带着数字眼睛的主持人悬空而立！对台下的观众喊道：女士们先生们随着新时代的跟进我们首台AI智能机器人沈念念即将发布届时沈念念给大家打招呼！随着主持人的话音落下台下纷纷传来掌声，主持人一跃而起跳到了厅板，用手按动了一个按钮这",id:34889348,image_urls:["\u002F\u002Fi0.hdslb.
